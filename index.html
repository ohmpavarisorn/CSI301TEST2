<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigitalWork | Freelance Escrow</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#17243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0}a{color:#385dd6;text-decoration:none}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#101c35;color:white;padding:26px 17px}aside h2{margin:0 0 5px;font-size:23px}aside small{color:#a8b8d5}aside nav{margin-top:42px;display:grid;gap:9px}.nav{padding:13px;text-align:left;border-radius:11px;color:#d2dbee;background:transparent}.nav.active,.nav:hover{background:#304b85;color:white}main{min-width:0}.top{background:white;border-bottom:1px solid #e5eaf2;padding:17px 30px;display:flex;justify-content:space-between;align-items:center;gap:12px}.content{padding:30px;max-width:1350px;margin:auto}.top-actions,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{padding:11px 16px;border-radius:10px;background:#e9eef9;color:#21345c;font-weight:600}.btn.primary{background:#3e63e9;color:white}.btn.danger{background:#ffe8e8;color:#9d2635}.btn:disabled{opacity:.55;cursor:wait}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:25px}.heading h1{font-size:30px;margin:0 0 8px}.muted{color:#78859a}.hero{padding:30px;border-radius:18px;background:linear-gradient(120deg,#172d65,#4569e8);color:white;margin-bottom:22px}.hero h2{font-size:26px;margin:0 0 10px}.hero p{color:#dce5ff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}.card,.panel{background:white;border:1px solid #e6eaf3;border-radius:15px;padding:22px;box-shadow:0 3px 15px #17243b08}.card strong{display:block;font-size:25px;margin:12px 0}.panel{margin-bottom:18px}.panel h3{margin:0 0 14px}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:15px 11px;border-bottom:1px solid #edf0f6}th{color:#78859a;font-size:13px}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f5f8ff}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#e9eef9;color:#3c5b91;font-size:12px}.status.s3{background:#e3f8ed;color:#147545}.status.s4{background:#ffe5e5;color:#b12e3b}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.field{display:grid;gap:7px;margin-bottom:16px}.field input,.field textarea,#search{border:1px solid #dbe2ee;border-radius:10px;padding:12px;width:100%;background:white}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.overlay{position:fixed;inset:0;background:#081329aa;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:white;padding:26px;border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal header{display:flex;justify-content:space-between;align-items:center}.notice{background:#fff5df;padding:14px;border-radius:10px;margin-bottom:16px}.toast{position:fixed;right:20px;bottom:20px;max-width:450px;padding:16px 20px;background:#17243b;color:white;border-radius:12px;box-shadow:0 5px 20px #0003;z-index:20}.address{overflow-wrap:anywhere}.action{display:block;width:100%;text-align:left;margin:10px 0}.hidden{display:none!important}@media(max-width:850px){.shell{display:block}aside{padding:15px}aside nav{display:flex;overflow:auto;margin-top:12px}.nav{white-space:nowrap}.top,.content{padding:17px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.stats,.form-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="shell"><aside><h2>DigitalWork</h2><small>ESCROW PLATFORM · HTML EDITION</small><nav><button class="nav active" data-page="dashboard">ภาพรวม</button><button class="nav" data-page="projects">โปรเจกต์ของฉัน</button><button class="nav" data-page="disputes">ข้อพิพาท</button><button class="nav" data-page="activity">ประวัติธุรกรรม</button></nav><p style="margin-top:35px;color:#b9c9e6;font-size:13px">🔒 Smart Contract บน Ethereum Sepolia</p></aside><main><div class="top"><b id="breadcrumb">Workspace / ภาพรวม</b><div class="top-actions"><span id="network" class="muted">ยังไม่เชื่อมต่อ</span><button class="btn" id="connect">Connect MetaMask</button></div></div><div class="content"><div id="notice" class="notice hidden"></div><div id="root"></div></div></main></div><div id="modal" class="overlay hidden"><div class="modal"><header><h2>สร้างข้อตกลงการจ้างงาน</h2><button class="btn" id="closeModal">✕</button></header><p class="muted">ข้อมูลจะถูกบันทึกลง Smart Contract</p><form id="createForm"><label class="field">ชื่อโปรเจกต์<input name="title" maxlength="100" required></label><label class="field">รายละเอียดงาน<textarea name="description" rows="3" required></textarea></label><label class="field">Freelancer Wallet Address<input name="freelancer" placeholder="0x..." required></label><div class="form-grid"><label class="field">ค่าจ้าง (ETH)<input name="amount" type="number" min="0.000001" step="any" required></label><label class="field">กำหนดส่ง<input name="deadline" type="datetime-local" required></label></div><p class="muted">หลังสร้างงาน ผู้ว่าจ้างต้องฝากเงินด้วย Deposit</p><button class="btn primary" type="submit">Create Agreement</button></form></div></div><div id="toast" class="toast hidden"></div>
<script type="module">
import { ethers } from 'https://esm.sh/ethers@6.13.5';
const CONTRACT_ADDRESS='0x509CA7bcc61fcb7cC7652170d7218Ec84b44Ec91', CHAIN=11155111;
const ABI=["function arbiter() view returns (address)","function jobCount() view returns (uint256)","function jobs(uint256) view returns (uint256 id,string title,string description,address client,address freelancer,uint256 amount,uint256 deadline,string deliverable,uint8 status,uint256 createdAt)","function createJob(string _title,string _description,address payable _freelancer,uint256 _amount,uint256 _deadline) returns (uint256)","function depositPayment(uint256 _jobId) payable","function submitWork(uint256 _jobId,string _deliverable)","function approveAndPay(uint256 _jobId)","function raiseDispute(uint256 _jobId)","function resolveDispute(uint256 _jobId,bool _releaseToFreelancer)","event JobCreated(uint256 indexed jobId,address indexed client,address indexed freelancer,uint256 amount,string title)","event PaymentDeposited(uint256 indexed jobId,address indexed client,uint256 amount)","event WorkSubmitted(uint256 indexed jobId,address indexed freelancer,string deliverable)","event PaymentReleased(uint256 indexed jobId,address indexed freelancer,uint256 amount)","event DisputeRaised(uint256 indexed jobId,address indexed raisedBy)","event DisputeResolved(uint256 indexed jobId,address indexed recipient,uint256 amount,bool releasedToFreelancer)"];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>s?`${s.slice(0,6)}...${s.slice(-4)}`:'—', eth=v=>Number(ethers.formatEther(v||0n)).toLocaleString('en-US',{maximumFractionDigits:5}), date=v=>new Date(Number(v)*1000).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
const statuses=['รอฝากเงิน','กำลังดำเนินงาน','รอตรวจรับงาน','สำเร็จ','มีข้อพิพาท','คืนเงินแล้ว'];
let account='',chainId=0,arbiter='',jobs=[],events=[],page='dashboard',selected=null,search='',busy=false;
const provider=()=>{if(!window.ethereum)throw Error('ไม่พบ MetaMask กรุณาติดตั้ง MetaMask ก่อนใช้งาน');return new ethers.BrowserProvider(window.ethereum)};
const contract=async write=>new ethers.Contract(CONTRACT_ADDRESS,ABI,write?await provider().getSigner():provider());
const err=e=>{let m=e?.shortMessage||e?.reason||e?.message||String(e);if(/user rejected|ACTION_REJECTED/i.test(m))return 'คุณยกเลิกธุรกรรมใน MetaMask';if(/insufficient funds/i.test(m))return 'ETH ไม่เพียงพอ';return m.slice(0,250)};
function toast(msg,hash){const el=$('#toast');el.innerHTML=`${esc(msg)} ${hash?`<a style="color:#a8c8ff" target="_blank" rel="noopener" href="https://sepolia.etherscan.io/tx/${encodeURIComponent(hash)}">ดูธุรกรรม ↗</a>`:''}`;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),7000)}
async function connect(){try{const p=provider();const a=await p.send('eth_requestAccounts',[]);account=a[0]||'';chainId=Number((await p.getNetwork()).chainId);render();toast('เชื่อมต่อ Wallet สำเร็จ')}catch(e){toast(err(e))}}
async function refresh(){try{const c=await contract(false);const [count,admin]=await Promise.all([c.jobCount(),c.arbiter()]);arbiter=admin;const total=Number(count);if(total>2000)throw Error('จำนวนงานมากเกินกว่าจะโหลดพร้อมกัน');jobs=(await Promise.all(Array.from({length:total},(_,i)=>i+1).map(async id=>{const j=await c.jobs(id);return {id:Number(j.id),title:j.title,description:j.description,client:j.client,freelancer:j.freelancer,amount:j.amount,deadline:j.deadline,deliverable:j.deliverable,status:Number(j.status),createdAt:j.createdAt}}))).reverse();if(selected)selected=jobs.find(j=>j.id===selected.id)||null;try{const p=provider();const from=Math.max(0,(await p.getBlockNumber())-50000);const names=['JobCreated','PaymentDeposited','WorkSubmitted','PaymentReleased','DisputeRaised','DisputeResolved'];const logs=await Promise.all(names.map(n=>c.queryFilter(c.filters[n](),from,'latest')));events=logs.flat().map(l=>({name:l.fragment?.name,jobId:l.args?.jobId?.toString(),hash:l.transactionHash,block:l.blockNumber})).sort((a,b)=>b.block-a.block).slice(0,30)}catch{events=[]}render()}catch(e){toast('โหลดข้อมูล Blockchain ไม่สำเร็จ: '+err(e));render()}}
async function tx(label,action){if(busy)return;busy=true;render();try{if(!account)throw Error('กรุณาเชื่อมต่อ MetaMask');if(Number((await provider().getNetwork()).chainId)!==CHAIN)throw Error('กรุณาเปลี่ยน MetaMask เป็น Sepolia (Chain ID 11155111)');const c=await contract(true);const t=await action(c);toast('ส่งธุรกรรมแล้ว กำลังรอยืนยัน',t.hash);await t.wait();toast('ทำรายการสำเร็จ',t.hash);await refresh();return true}catch(e){toast(err(e));return false}finally{busy=false;render()}}
const btn=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}" ${busy?'disabled':''}>${esc(label)}</button>`;
function table(rows){return `<div class="panel table-scroll">${rows.length?`<table><thead><tr><th>โปรเจกต์</th><th>Job ID</th><th>Freelancer</th><th>มูลค่า</th><th>กำหนดส่ง</th><th>สถานะ</th></tr></thead><tbody>${rows.map(j=>`<tr data-id="${j.id}"><td><b>${esc(j.title)}</b><div class="muted">Created ${date(j.createdAt)}</div></td><td>#${j.id}</td><td>${short(j.freelancer)}</td><td>${eth(j.amount)} ETH</td><td>${date(j.deadline)}</td><td><span class="status s${j.status}">${statuses[j.status]}</span></td></tr>`).join('')}</tbody></table>`:'<p class="muted">ยังไม่มีโปรเจกต์ในรายการนี้</p>'}</div>`}
function detail(j){const isClient=account.toLowerCase()===j.client.toLowerCase(),isFreelancer=account.toLowerCase()===j.freelancer.toLowerCase(),isAdmin=account&&account.toLowerCase()===arbiter.toLowerCase();let actions='';if(isClient&&j.status===0)actions+=btn('Deposit Payment','deposit','primary');if(isFreelancer&&(j.status===1||j.status===2))actions+=`<label class="field">URL หรือ Hash ของผลงาน<textarea id="deliverable" rows="3">${esc(j.deliverable)}</textarea></label><label class="field">เลือกไฟล์เพื่อสร้าง SHA-256 Hash<input type="file" id="workfile"></label>${btn('Submit Work','submit','primary')}`;if(isClient&&j.status===2)actions+=btn('Approve & Release','approve','primary');if((isClient||isFreelancer)&&(j.status===1||j.status===2))actions+=btn('Raise Dispute','dispute','danger');if(isAdmin&&j.status===4)actions+=btn('Release to Freelancer','resolvePay','primary')+btn('Refund to Client','resolveRefund','danger');return `<div class="heading"><div><button class="btn" data-action="back">← กลับ</button><h1 style="margin-top:16px">${esc(j.title)}</h1><span class="status s${j.status}">${statuses[j.status]}</span></div></div><div class="grid"><div><div class="panel"><h3>รายละเอียดข้อตกลง</h3><p style="white-space:pre-wrap">${esc(j.description)}</p><p><b>ค่าจ้าง:</b> ${eth(j.amount)} ETH</p><p><b>กำหนดส่ง:</b> ${date(j.deadline)}</p><p><b>Job ID:</b> #${j.id}</p></div><div class="panel"><h3>การส่งมอบงาน</h3><p class="address">${esc(j.deliverable||'ยังไม่มีการส่งมอบงาน')}</p></div></div><div><div class="panel"><h3>จัดการโปรเจกต์</h3>${actions||'<p class="muted">ไม่มีรายการที่คุณสามารถดำเนินการได้</p>'}</div><div class="panel"><h3>คู่สัญญา</h3><p>Client<br><a class="address" target="_blank" rel="noopener" href="https://sepolia.etherscan.io/address/${encodeURIComponent(j.client)}">${esc(j.client)}</a></p><p>Freelancer<br><a class="address" target="_blank" rel="noopener" href="https://sepolia.etherscan.io/address/${encodeURIComponent(j.freelancer)}">${esc(j.freelancer)}</a></p></div></div></div>`}
function render(){const pages={dashboard:'ภาพรวม',projects:'โปรเจกต์ของฉัน',disputes:'ข้อพิพาท',activity:'ประวัติธุรกรรม'};$('#breadcrumb').textContent='Workspace / '+pages[page];$('#connect').textContent=account?short(account):'Connect MetaMask';$('#network').textContent=chainId===CHAIN?'● Sepolia Testnet':chainId?'⚠ Chain '+chainId:'ยังไม่เชื่อมต่อ';$('#notice').classList.toggle('hidden',!chainId||chainId===CHAIN);$('#notice').textContent='กรุณาเปลี่ยนเครือข่าย MetaMask เป็น Sepolia (Chain ID 11155111)';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(selected){$('#root').innerHTML=detail(selected);return}const title=pages[page];let html=`<div class="heading"><div><p class="muted">FREELANCE WORKSPACE</p><h1>${title}</h1><p class="muted">จัดการโปรเจกต์และการชำระเงินผ่าน Smart Contract</p></div><div class="actions">${btn('↻ รีเฟรช','refresh')}${btn('+ สร้างโปรเจกต์','new','primary')}</div></div>`;if(page==='dashboard'){const locked=jobs.filter(j=>[1,2,4].includes(j.status)).reduce((s,j)=>s+Number(ethers.formatEther(j.amount)),0);html+=`<div class="hero"><h2>ทำงานอย่างมั่นใจ ทุกการจ่ายเงินมีหลักประกัน</h2><p>สร้างข้อตกลง ฝากเงิน ส่งมอบงาน และอนุมัติจ่ายผ่าน Ethereum Sepolia</p></div><div class="stats">${[['โปรเจกต์ทั้งหมด',jobs.length],['กำลังดำเนินงาน',jobs.filter(j=>[1,2].includes(j.status)).length],['ยอดเงินใน Escrow',locked.toFixed(5)+' ETH'],['งานสำเร็จ',jobs.filter(j=>j.status===3).length]].map(([k,v])=>`<div class="card"><span class="muted">${k}</span><strong>${v}</strong></div>`).join('')}</div><h3>โปรเจกต์ล่าสุด</h3>`+table(jobs.slice(0,5))}if(page==='projects'||page==='disputes'){let rows=page==='disputes'?jobs.filter(j=>j.status===4):jobs.filter(j=>account&&[j.client,j.freelancer].some(a=>a.toLowerCase()===account.toLowerCase()));if(page==='projects')html+=`<label class="field"><input id="search" placeholder="ค้นหาชื่อโปรเจกต์ / Wallet / ID" value="${esc(search)}"></label>`;if(search&&page==='projects')rows=rows.filter(j=>`${j.title} ${j.id} ${j.client} ${j.freelancer}`.toLowerCase().includes(search.toLowerCase()));html+=table(rows)}if(page==='activity')html+=`<div class="panel"><h3>On-chain Activity</h3>${events.length?events.map(e=>`<p>${esc(e.name)} · Job #${esc(e.jobId)} · Block #${e.block} <a target="_blank" rel="noopener" href="https://sepolia.etherscan.io/tx/${encodeURIComponent(e.hash)}">${short(e.hash)} ↗</a></p>`).join(''):'<p class="muted">ยังไม่มีประวัติธุรกรรม</p>'}</div>`;$('#root').innerHTML=html}
$('#connect').addEventListener('click',connect);document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;selected=null;search='';render()}));$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden')});$('#createForm').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const deadline=Math.floor(new Date(f.deadline).getTime()/1000);if(deadline<=Date.now()/1000)return toast('กำหนดส่งต้องอยู่ในอนาคต');if(!ethers.isAddress(f.freelancer)||f.freelancer.toLowerCase()===account.toLowerCase())return toast('Wallet ฟรีแลนซ์ไม่ถูกต้อง');if(!f.title.trim()||!f.description.trim()||Number(f.amount)<=0)return toast('ข้อมูลไม่ถูกต้อง');const ok=await tx('create',c=>c.createJob(f.title,f.description,f.freelancer,ethers.parseEther(f.amount),deadline));if(ok){$('#modal').classList.add('hidden');e.target.reset()}});
$('#root').addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();const input=$('#search');input?.focus();input?.setSelectionRange(pos,pos)}});
$('#root').addEventListener('change',async e=>{if(e.target.id==='workfile'&&e.target.files[0]){const digest=await crypto.subtle.digest('SHA-256',await e.target.files[0].arrayBuffer());const hash='0x'+Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');$('#deliverable').value=hash;toast('สร้าง SHA-256 File Hash สำเร็จ (ไฟล์ไม่ได้ถูกอัปโหลด)')}});
$('#root').addEventListener('click',async e=>{const row=e.target.closest('[data-id]');if(row){selected=jobs.find(j=>j.id===Number(row.dataset.id));render();return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='new'){$('#modal').classList.remove('hidden');return}if(action==='refresh'){await refresh();return}if(action==='back'){selected=null;render();return}if(!selected)return;const j=selected;if(['resolvePay','resolveRefund'].includes(action)&&!confirm(action==='resolvePay'?'ยืนยันจ่ายเงินให้ฟรีแลนซ์?':'ยืนยันคืนเงินให้ผู้ว่าจ้าง?'))return;const actions={deposit:c=>c.depositPayment(j.id,{value:j.amount}),approve:c=>c.approveAndPay(j.id),dispute:c=>c.raiseDispute(j.id),resolvePay:c=>c.resolveDispute(j.id,true),resolveRefund:c=>c.resolveDispute(j.id,false),submit:c=>{const value=$('#deliverable')?.value.trim();if(!value)throw Error('กรุณาใส่ URL หรือ Hash ก่อนส่งงาน');return c.submitWork(j.id,value)}};if(actions[action])await tx(action,actions[action])});
if(window.ethereum){window.ethereum.request({method:'eth_accounts'}).then(async a=>{account=a?.[0]||'';chainId=Number((await provider().getNetwork()).chainId);render()}).catch(()=>{});window.ethereum.on?.('accountsChanged',a=>{account=a?.[0]||'';render()});window.ethereum.on?.('chainChanged',()=>location.reload())}render();refresh();
</script></body></html>
